[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
# The "lerobot_robot_" prefix lets lerobot's register_third_party_plugins() import this package,
# so `--robot.type=fanuc_crx` works in lerobot-rollout / lerobot-record / lerobot-teleoperate.
name = "lerobot_robot_fanuc_crx"
version = "0.0.1"
description = "LeRobot Robot adapter skeleton for FANUC CRX (joint position control, position hold)"
requires-python = ">=3.12"
dependencies = ["lerobot==0.7.0"]

[tool.setuptools]
packages = ["lerobot_robot_fanuc_crx"]
